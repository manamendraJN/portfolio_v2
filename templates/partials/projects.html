{% load portfolio_tags %}
<section id="work" class="layer sheet pt-16 md:pt-24" aria-labelledby="work-title" data-section>
  <div class="sheet-edge" aria-hidden="true"></div>
  <div class="wrap">
    {% section_heading "01" "Selected projects" "" "" "" "work-title" %}
  </div>


  <div class="stack mt-12 md:mt-16" data-stack>
    {% for project in projects %}
      {% project_card project projects|length %}
    {% endfor %}
  </div>
</section>
