{% load portfolio_tags %}
<section id="skills" class="sheet" aria-labelledby="skills-title" data-section>
  <div class="wrap">
    {% section_heading "02" "Technical skills" "" "" "" "skills-title" %}
    <ul class="skill-grid list-none p-0">
      {% for group in skill_groups %}
      <li class="skill-card">
        <h3 class="skill-card-title">{% icon group.icon %}<span>{{ group.name }}</span></h3>
        <ul class="skill-tags" aria-label="{{ group.name }} skills">
          {% for item in group.items %}<li class="tag">{{ item }}</li>{% endfor %}
        </ul>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
