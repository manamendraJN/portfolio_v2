{% load portfolio_tags %}
<section id="about" class="layer sheet pt-16 md:pt-24" aria-labelledby="about-title" data-section>
  <div class="sheet-edge" aria-hidden="true"></div>
  <div class="wrap about-grid grid gap-8 lg:grid-cols-12 lg:gap-10">
    <div class="lg:col-span-6" data-speed="0.5">
      {% section_heading "03" "About" "" "" "" "about-title" %}
      <div class="about-text space-y-3 max-w-xl">
        {% for para in about %}<p>{{ para }}</p>{% endfor %}
      </div>
    </div>
    <div class="lg:col-span-6">
      <h3 class="sr-only">Three themes</h3>
      <div class="about-cards grid gap-3" data-focus-stack>
        {% for card in focus_cards %}
        <article class="focus-card about-card" data-focus-card>
          <span class="about-card-num" aria-hidden="true">{{ card.number }}</span>
          <div class="about-card-body">
            <h4 class="about-card-title">{{ card.title }}</h4>
            <p class="about-card-text">{{ card.text }}</p>
          </div>
          <span class="about-card-icon" aria-hidden="true">{% icon card.icon %}</span>
        </article>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
