{# Shown only when <html> has .js-preload (first visit per session, motion allowed). Hidden otherwise. #}
<div class="preloader" data-preloader role="status" aria-label="Loading">
  <div class="text-center">
    <svg class="mx-auto mb-4 h-20 w-20" viewBox="0 0 80 80" aria-hidden="true">
      <path data-preloader-mark d="M14 64V16l52 48V16" fill="none" stroke="#C2411F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="preloader-count" aria-hidden="true"><span data-preloader-count>00</span></div>
    <button type="button" class="label mt-6 underline underline-offset-4" data-preloader-skip>Skip intro</button>
  </div>
</div>
