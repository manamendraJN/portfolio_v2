{% comment %}Original illustration: a small floating island with a developer's desk. Hover or focus an object for a label.
   Scrolling zooms into the laptop screen (parallax.js), which opens into the story. Decorative apart from the labelled objects.{% endcomment %}
<div class="island-scene" data-island>
  <div class="island-clouds" aria-hidden="true">
    <svg viewBox="0 0 900 640" preserveAspectRatio="xMidYMid slice" focusable="false">
      <g fill="#FFF7F1">
        <g class="cloud c1" opacity=".75"><ellipse cx="150" cy="170" rx="95" ry="26"/><ellipse cx="205" cy="152" rx="58" ry="28"/><ellipse cx="108" cy="156" rx="46" ry="22"/></g>
        <g class="cloud c2" opacity=".65"><ellipse cx="760" cy="120" rx="110" ry="28"/><ellipse cx="715" cy="102" rx="60" ry="26"/><ellipse cx="820" cy="106" rx="50" ry="20"/></g>
        <g class="cloud c3" opacity=".7"><ellipse cx="90" cy="470" rx="100" ry="26"/><ellipse cx="150" cy="454" rx="56" ry="24"/></g>
        <g class="cloud c4" opacity=".6"><ellipse cx="800" cy="470" rx="108" ry="28"/><ellipse cx="748" cy="452" rx="58" ry="26"/></g>
      </g>
    </svg>
  </div>

      {# grass top #}
      <path d="M90 470C90 440 170 424 260 428C340 424 560 424 640 428C730 424 810 440 810 470C810 492 700 504 450 504C200 504 90 492 90 470Z" fill="#9DB88A"/>
      <path d="M90 470C90 492 200 504 450 504C700 504 810 492 810 470C810 484 700 488 450 488C200 488 90 484 90 470Z" fill="#7E9C6E" opacity=".7"/>

      <path d="M200 412H700V420H200Z" fill="#E7C9A5"/>
      <path d="M230 436V478M670 436V478" stroke="#B88F6A" stroke-width="10" stroke-linecap="round"/>
      <path d="M200 436H700" stroke="#B88F6A" stroke-width="3" opacity=".7"/>

      {# laptop #}
      <g data-hot="Full-stack apps, from API to UI" tabindex="0" role="img" aria-label="Laptop: full-stack apps, from API to UI" class="hot">
        <path d="M318 412L334 400H566L582 412Z" fill="#CFC8D6"/>

        <path d="M250 372H290V412H250Z" fill="#FFF7F1"/><path d="M250 372H290V380H250Z" fill="#E9DDD2"/>
        <path d="M290 382Q308 382 308 396Q308 408 290 406" stroke="#FFF7F1" stroke-width="6" fill="none" stroke-linecap="round"/>

      <g data-hot="Clean, readable code" tabindex="0" role="img" aria-label="Code symbol: clean, readable code" class="hot float-slow">
        <rect x="170" y="238" width="86" height="54" rx="10" fill="#FFF7F1" opacity=".9"/>
        <text x="213" y="274" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="26" fill="#C2411F">&lt;/&gt;</text>
      </g>
      <g data-hot="Ship it" tabindex="0" role="img" aria-label="Paper plane: ship it" class="hot float-slow2">
        <path d="M690 232L770 204L736 262L722 244Z" fill="#FFF7F1"/><path d="M722 244L770 204L728 250Z" fill="#E6D8CF"/>

  <div class="hot-tip" role="status" aria-live="polite" data-hot-tip hidden></div>
